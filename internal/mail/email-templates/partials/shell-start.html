{{define "shell-start"}}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f5f0e8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased;">
    <div style="max-width: 640px; margin: 24px auto; background: #ffffff; border-radius: 16px; border: 1px solid #e8e4df; overflow: hidden;">
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background: #AE7820;">
        <tr>
          <td align="center" style="padding: 28px 24px;">
            <span style="font-family: Georgia, 'Times New Roman', serif; font-size: 26px; font-weight: 700; color: #ffffff; letter-spacing: 0.02em;">Home Essentials by Kamgol</span>
          </td>
        </tr>
      </table>
      <div style="padding: 32px 28px 24px;">
        <h1 style="margin: 0 0 20px 0; font-family: Georgia, 'Times New Roman', serif; font-size: 22px; font-weight: 700; color: #1c1917; line-height: 1.3;">{{.Heading}}</h1>
{{end}}
